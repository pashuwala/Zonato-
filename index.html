<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zonato Solar | Renewable Energy Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #050b14, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      padding: 1.5rem;
      overflow: hidden;
      cursor: default;
      position: relative;
    }

    /* Navigation Bar */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: rgba(5, 11, 20, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      z-index: 100;
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffd700, #00ffc8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      font-weight: 500;
      letter-spacing: 0.5px;
      position: relative;
    }

    .nav-links a:hover {
      color: #00ffc8;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(135deg, #ffd700, #00ffc8);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a.active {
      color: #ffd700;
    }

    .nav-links a.active::after {
      width: 100%;
    }

    /* Ambient background lighting elements */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 180, 0, 0.1), transparent 70%);
      top: 20%;
      left: 15%;
      pointer-events: none;
      filter: blur(80px);
    }

    .ambient-glow-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 255, 200, 0.08), transparent 70%);
      bottom: 10%;
      right: 10%;
      pointer-events: none;
      filter: blur(100px);
    }

    /* Holographic particle canvas */
    .diffraction-field {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .holo-particle {
      position: absolute;
      background: radial-gradient(circle, #ffd700, #ffb400);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      filter: blur(2px);
      animation: holoDrift 3s infinite alternate;
      opacity: 0.7;
      will-change: transform, opacity;
    }

    @keyframes holoDrift {
      0% { transform: translateX(0) translateY(0) scale(1); opacity: 0.2; }
      100% { transform: translateX(25px) translateY(-20px) scale(1.6); opacity: 0.9; }
    }

    /* Main content container */
    .content-container {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 800px;
      animation: fadeIn 1s ease-in;
      margin-top: 60px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }

    .title {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffd700, #00ffc8, #ffd700);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subtitle {
      font-size: 1.3rem;
      color: rgba(0, 255, 200, 0.9);
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .description {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2.5rem;
      line-height: 1.8;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.9rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 1px;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffd700, #ffb400);
      color: #000;
      border-color: #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
    }

    .btn-secondary {
      background: transparent;
      color: #00ffc8;
      border-color: #00ffc8;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      background: rgba(0, 255, 200, 0.1);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.6);
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 3rem;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    .stat-label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }

      .nav-links {
        gap: 1rem;
      }

      .title {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .cta-buttons {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 100%;
        max-width: 300px;
      }

      .content-container {
        margin-top: 100px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-logo">☀️ ZONATO</div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="business-card-hologram.html">Business Card</a></li>
    </ul>
  </nav>

  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>
  <div class="diffraction-field" id="particleField"></div>

  <div class="content-container">
    <div class="logo">☀️</div>
    <h1 class="title">ZONATO SOLAR</h1>
    <p class="subtitle">RENEWABLE ENERGY SOLUTIONS</p>
    
    <p class="description">
      Harness the power of the sun with Zonato Solar's cutting-edge renewable energy technology. 
      Transform your energy future today.
    </p>

    <div class="cta-buttons">
      <button class="btn btn-primary">Get Started</button>
      <a href="business-card-hologram.html" class="btn btn-secondary">View Business Card</a>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-number">50K+</div>
        <div class="stat-label">Active Systems</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">2.5M</div>
        <div class="stat-label">Tons CO₂ Saved</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">99.9%</div>
        <div class="stat-label">Uptime</div>
      </div>
    </div>
  </div>

<script>
  (function() {
    // Keep particle field generation intact for the blank space
    const particleField = document.getElementById('particleField');
    if (particleField) {
      for (let i = 0; i < 45; i++) {
        const particle = document.createElement('div');
        particle.classList.add('holo-particle');
        const size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 4 + 's';
        particle.style.animationDuration = Math.random() * 3 + 2 + 's';
        
        // Solar-themed colors: gold/yellow and cyan
        const roll = Math.random();
        if (roll > 0.6) {
          particle.style.background = 'radial-gradient(circle, #ffd700, rgba(255,215,0,0.2))';
        } else if (roll > 0.3) {
          particle.style.background = 'radial-gradient(circle, #00ffc8, rgba(0,255,200,0.2))';
        } else {
          particle.style.background = 'radial-gradient(circle, #ffb400, rgba(255,180,0,0.2))';
        }
        
        particleField.appendChild(particle);
      }
    }
  })();
</script>
</body>
</html>
